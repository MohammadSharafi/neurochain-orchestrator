name: neurochain_frontend
description: NeuroChain Orchestrator - Flutter Frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # GraphQL
  graphql_flutter: ^5.1.2

  # UI
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  fl_chart: ^0.65.0
  file_picker: ^6.1.1
  path_provider: ^2.1.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  json_annotation: ^4.8.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mockito: ^5.4.4

flutter:
  uses-material-design: true

