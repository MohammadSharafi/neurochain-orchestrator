spring:
  application:
    name: neurochain-orchestrator
  
  datasource:
    url: jdbc:postgresql://localhost:5432/neurochain
    username: neurochain
    password: neurochain
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

ai-worker:
  base-url: http://localhost:5000
  grpc-port: 50051

models:
  directory: ./models

grpc:
  server:
    port: 50051

server:
  port: 8080

logging:
  level:
    com.neurochain: DEBUG
    org.springframework.graphql: DEBUG

